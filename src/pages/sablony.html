<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Šablony v plné velikosti - Brightbox</title>
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/tpl.css">
<style>
  body{margin:0;background:#D9D4E2;font-family:Geist,sans-serif}
  .lib{display:flex;flex-wrap:wrap;gap:80px;padding:80px;align-items:flex-start}
  .show-safe .tp__safe{display:flex}
  /* prohlížení: každá šablona zmenšená na šířku okna; ?native = 1:1 pro export */
  .fit .lib{gap:32px;padding:32px 16px}
  .fit .tp{zoom:var(--z,1)}
</style>
</head>
<body>
<div class="lib">
{{> templates}}
</div>
<script>
const q = new URLSearchParams(location.search);
if (q.has('safe')) document.body.classList.add('show-safe');
if (!q.has('native')) {
  document.body.classList.add('fit');
  const fit = () => {
    const room = document.documentElement.clientWidth - 32;
    document.querySelectorAll('.lib > .tp').forEach(t => t.style.setProperty('--z', Math.min(1, room / parseFloat(getComputedStyle(t).width)).toFixed(4)));
  };
  fit(); addEventListener('resize', fit);
}
</script>
</body>
</html>
